# PixTrain derleme hattı (GameCI)
#
# 1. .NET: kurallar ve çizim testleri (Unity gerekmez) + oyun karelerinin PNG'leri
# 2. Unity EditMode testleri (aynı testler Unity içinde)
# 3. Derleme: WebGL (tarayıcı) ve Android (APK)
# 4. İsteğe bağlı: WebGL'i GitHub Pages'e yayınla (repo değişkeni DEPLOY_PAGES = true ise)
#
# Gerekli repo secret'ları: UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD (bkz. docs/UNITY.md)

name: PixTrain CI

on:
  push:
    paths-ignore:
      - 'prototype/**'
      - 'docs/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  PROJECT_PATH: unity/PixTrain

jobs:
  dotnet:
    name: Kurallar ve çizim testleri (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Testler
        run: dotnet test dotnet/PixTrain.sln

      - name: Oyun kareleri (PNG)
        run: dotnet run -c Release --project dotnet/PixTrain.Snapshots -- snapshots

      - uses: actions/upload-artifact@v4
        with:
          name: PixTrain-kareler
          path: snapshots

  unity-tests:
    name: Unity EditMode testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-test-${{ hashFiles('unity/PixTrain/Assets/**', 'unity/PixTrain/Packages/**', 'unity/PixTrain/ProjectSettings/**') }}
          restore-keys: |
            Library-test-

      - name: Unity testleri
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity test raporu

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Unity-test-sonuclari
          path: artifacts

  build:
    name: Derleme (${{ matrix.targetPlatform }})
    needs: [dotnet, unity-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform: [WebGL, Android]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Disk alanı aç (Android imajı büyük)
        if: matrix.targetPlatform == 'Android'
        uses: jlumbroso/free-disk-space@v1.3.1

      - uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('unity/PixTrain/Assets/**', 'unity/PixTrain/Packages/**', 'unity/PixTrain/ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-

      - name: Unity derlemesi
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: PixTrain
          androidExportType: androidPackage

      - uses: actions/upload-artifact@v4
        with:
          name: PixTrain-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}

      # WebGL: derlemeyi başsız Chromium'da açıp başlık -> hat -> sefer -> test reklamıyla devam akışını dener.
      - uses: actions/setup-node@v4
        if: matrix.targetPlatform == 'WebGL'
        with:
          node-version: '22'

      - name: Tarayıcı duman testi (WebGL)
        if: matrix.targetPlatform == 'WebGL'
        working-directory: tools/webgl-smoke
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          python3 -m http.server 8080 -d "$GITHUB_WORKSPACE/build/WebGL/PixTrain" > /dev/null 2>&1 &
          sleep 2
          node smoke.js "http://localhost:8080/?ads=test" "$GITHUB_WORKSPACE/smoke" --print-shots

      - uses: actions/upload-artifact@v4
        if: always() && matrix.targetPlatform == 'WebGL'
        with:
          name: PixTrain-duman-testi
          path: smoke
          if-no-files-found: ignore

  pages:
    name: GitHub Pages (WebGL)
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && vars.DEPLOY_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PixTrain-WebGL
          path: site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/PixTrain

      - id: deploy
        uses: actions/deploy-pages@v4
